<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BMS 임피던스 튜닝</title>
  <script src="impTune.js" defer></script>
  <style>
    body { margin: 0; font-family: Arial, sans-serif; background: #e8eaee; color: #111; }
    .topbar { display: flex; justify-content: flex-end; align-items: center; padding: 10px 16px; background: #263343; color: #fff; }
    .layout { display: grid; grid-template-columns: 180px 1fr; gap: 10px; max-width: 1320px; margin: 14px auto; }
    .sidebar { background: #c8ced6; border: 1px solid #8e99a6; padding: 10px; }
    .sidebar h3 { margin: 0 0 10px; font-size: 14px; }
    .sidebar ul { margin: 0; padding-left: 16px; font-size: 14px; }
    .sidebar li { margin: 6px 0; }
    .sidebar a { color: #111; text-decoration: none; cursor: pointer; }
    .sidebar a.active { font-weight: bold; }
    .panel { background: #f5f6f8; border: 1px solid #8e99a6; padding: 10px; }
    .panel-header { background: #213a59; color: #fff; font-weight: bold; padding: 8px 10px; margin-bottom: 8px; }
    .help-box { margin: 6px 0 10px; padding: 8px; background: #e8edf3; border: 1px solid #7e8793; font-size: 13px; }
    .section-title { margin: 8px 0; padding: 6px 8px; background: #d6dbe2; border: 1px solid #7e8793; font-weight: bold; text-align: center; }
    .row { display: flex; gap: 8px; align-items: center; margin: 8px 0; flex-wrap: wrap; }
    .row label { font-size: 13px; }
    .row input[type="number"] { width: 120px; box-sizing: border-box; }
    table { width: 100%; border-collapse: collapse; background: #eef1f5; }
    th, td { border: 1px solid #7e8793; padding: 6px 8px; font-size: 13px; text-align: center; }
    th { background: #04AA6D; color: #fff; }
    .table-wrap { overflow-x: auto; }
    .btn { border: 1px solid #566273; background: #fff; padding: 5px 10px; cursor: pointer; }
    .meta { display: flex; justify-content: space-between; align-items: center; margin-top: 10px; font-size: 13px; }
    #statusText { color: #1f2d3d; font-weight: bold; }
  </style>
</head>
<body>
  <div class="topbar"></div>

  <div class="layout">
    <aside class="sidebar">
      <h3>현재 상태</h3>
      <ul>
        <li><a href="index.html">BMS 데이타</a></li>
        <li><a href="basicInfo.html">BMS 제어</a></li>
        <li><a href="impTune.html" class="active">임피던스 튜닝</a></li>
      </ul>
    </aside>

    <main class="panel">
      <div class="panel-header">[ BMS-IMP ] 임피던스 튜닝</div>

      <div class="help-box">
        현재 측정 내부저항을 보면서 전역 Gain/Offset 및 셀별 보정값을 적용할 수 있습니다.
      </div>

      <div class="section-title">전역 보정</div>
      <div class="row">
        <label>Gain (0.1~4.0)</label>
        <input id="gainInput" type="number" step="0.001" min="0.1" max="4.0">
        <label>Offset mOhm (-327.68~327.67)</label>
        <input id="offsetInput" type="number" step="0.01" min="-327.68" max="327.67">
        <button id="saveGlobalBtn" class="btn">전역 저장</button>
      </div>

      <div class="section-title">셀별 보정</div>
      <div class="row">
        <button id="refreshBtn" class="btn">새로고침</button>
        <label>전체 보정(mOhm)</label>
        <input id="allCompInput" type="number" step="0.01" min="-327.68" max="327.67">
        <button id="applyAllBtn" class="btn">전체 적용</button>
      </div>
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>Cell</th>
              <th>현재 Z (mOhm)</th>
              <th>기준 Z (mOhm)</th>
              <th>기준 설정값 (mOhm)</th>
              <th>보정값 (mOhm)</th>
              <th>보상 설정값 (mOhm)</th>
              <th>동작</th>
            </tr>
          </thead>
          <tbody id="cellTuneBody">
            <tr><td colspan="7">불러오는 중...</td></tr>
          </tbody>
        </table>
      </div>

      <div class="meta">
        <div>상태</div>
        <div id="statusText">준비됨</div>
      </div>
    </main>
  </div>
</body>
</html>
